name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Backend Docker image tag"
        required: false
        default: "latest"

permissions:
  id-token: write
  contents: read
  packages: write

env:
  DOTNET_VERSION: 8.0.x
  BUILD_CONFIGURATION: Release
  SOLUTION_FILE: IdentityHub.sln
  IMAGE_NAME: identity-hub-service

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run code quality checks
        run: bash ./scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Run unit tests
        run: dotnet test ./tests/IdentityHub.UnitTests/IdentityHub.UnitTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build

      - name: Run integration tests
        run: dotnet test ./tests/IdentityHub.IntegrationTests/IdentityHub.IntegrationTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build

  pack-client:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/IdentityHub.Client/IdentityHub.Client.csproj

      - name: Pack IdentityHub.Client
        shell: bash
        run: |
          PACKAGE_VERSION="1.0.0-ci.${{ github.run_number }}"

          dotnet pack src/IdentityHub.Client/IdentityHub.Client.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            --output ./artifacts/nuget \
            /p:PackageVersion="$PACKAGE_VERSION"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: identity-hub-client
          path: artifacts/nuget/*.nupkg

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, pack-client]
    if: github.event_name != 'pull_request'
    outputs:
      backend_tag: ${{ steps.vars.outputs.backend_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set image tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.backend_tag }}" ]; then
            BACKEND_TAG="${{ github.event.inputs.backend_tag }}"
          else
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:6}"
            BACKEND_TAG="1.0.0-dev-${SHORT_SHA}"
          fi

          echo "backend_tag=${BACKEND_TAG:-latest}" >> "$GITHUB_OUTPUT"
          echo "Using backend tag: ${BACKEND_TAG:-latest}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      # Container Apps needs the app to listen on the same port exposed by the container.
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.backend_tag }} \
            .

      - name: Tag and push backend image
        shell: bash
        run: |
          local_tag="${{ steps.vars.outputs.backend_tag }}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          remote_tag="ghcr.io/${owner}/${{ env.IMAGE_NAME }}:${local_tag}"

          # Always push the versioned tag
          docker tag ${{ env.IMAGE_NAME }}:${local_tag} "$remote_tag"
          docker push "$remote_tag"

          # If this is the latest build, also tag and push as latest
          if [ "$local_tag" = "latest" ] || [ "$local_tag" = "main" ]; then
            latest_tag="ghcr.io/${owner}/${{ env.IMAGE_NAME }}:latest"
            docker tag ${{ env.IMAGE_NAME }}:${local_tag} "$latest_tag"
            docker push "$latest_tag"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name != 'pull_request'
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy to Azure Container Apps
        shell: bash
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.backend_tag }}"

          az containerapp update \
            --name "identity-hub" \
            --resource-group "projects" \
            --image "$image"
